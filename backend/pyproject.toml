[project]
name = "tekkscope"
version = "0.1.0"
description = "A Perplexity-style research and search API."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "local-deep-research>=0.1.0",
    "crawlee>=0.1.0",
    "playwright>=1.48.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.24.0",
    "redis>=5.0.0",
    "beautifulsoup4>=4.11.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "markdown2>=2.4.0",
    "duckduckgo-search>=5.0.0",
    "browserforge>=1.2.0",
    "apify-fingerprint-datapoints>=0.1.0",
    "langchain",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-anthropic",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "app/research_lib/web/static",
    "app/research_lib/web/templates",
    "app/research_lib/**",
    "app/clients/**",
    "app/research.py",
    "app/utils/rate_limiter.py",
    "app/utils/report_generator.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",
    "I001",
    "UP012",
    "UP006",
    "UP017",
    "UP035",
    "UP041",
    "UP045",
    "B008",
    "B904",
    "SIM105",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "app/research_lib/(web/static|web/templates)"

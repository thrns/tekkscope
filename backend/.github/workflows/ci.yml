name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q app

      - name: Ruff
        run: ruff check app tests

      - name: Type check maintained modules
        run: >-
          mypy app/main.py app/auth app/config app/models app/routers
          app/streaming.py app/utils/usage.py app/mcp_server.py
          --ignore-missing-imports --explicit-package-bases
          --follow-imports=skip --no-error-summary

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Dependency audit
        run: pip-audit

  container:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            tekkscope/tekkscope-backend:${{ github.sha }}
            tekkscope/tekkscope-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekkscope-search-engine
  labels:
    app: tekkscope-search-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekkscope-search-engine
  template:
    metadata:
      labels:
        app: tekkscope-search-engine
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: tekkscope-search-engine
        image: tekkscope/tekkscope-search-engine:latest
        ports:
        - containerPort: 8000
        env:
        - name: SEARXNG_BASE_URL
          value: "https://search.tekkscope.com/"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tekkscope-search-engine
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: tekkscope-search-engine
